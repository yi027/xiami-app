services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xiami
      POSTGRES_PASSWORD: xiami
      POSTGRES_DB: xiami
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiami -d xiami"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "43123:43123"
    environment:
      DATABASE_URL: postgresql://xiami:xiami@postgres:5432/xiami
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-this-secret}
      APP_URL: ${APP_URL:-http://127.0.0.1:43123}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
