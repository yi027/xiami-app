name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xiami
          POSTGRES_PASSWORD: xiami
          POSTGRES_DB: xiami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiami -d xiami_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://xiami:xiami@localhost:5432/xiami_test
      AUTH_SECRET: ci-secret-at-least-16-chars
      STORAGE_DRIVER: local
      APP_URL: http://127.0.0.1:43123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t xiami-app:ci .
